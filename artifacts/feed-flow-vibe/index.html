const c=document.getElementById('c');
const g=c.getContext('2d');
const W=1920,H=1080;
const FONT='"Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif';
const MONO='Consolas,"SFMono-Regular",monospace';

function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.setTransform(c.width/W,0,0,c.height/H,0,0)}
addEventListener('resize',resize);resize();
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function spring(t,w=15,z=.74){if(t<=0)return 0;const e=Math.exp(-z*w*t);const wd=w*Math.sqrt(Math.max(.001,1-z*z));return 1-e*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t))}
function mix(a,b,k){return a+(b-a)*k}
function rr(x,y,w,h,r,fill,stroke,lw=2){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function txt(s,x,y,size,color=C.ink,weight=700,align='left',family=FONT){g.font=`${weight} ${size}px ${family}`;g.textAlign=align;g.textBaseline='alphabetic';g.fillStyle=color;g.fillText(s,x,y)}
function ln(x1,y1,x2,y2,color,w=3,dash=[]){g.beginPath();g.setLineDash(dash);g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.stroke();g.setLineDash([])}
function circle(x,y,r,fill,stroke,lw=2){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function tag(label,x,y,fg,bg){g.font=`700 19px ${MONO}`;const w=g.measureText(label).width+38;rr(x,y,w,44,22,bg,null);txt(label,x+19,y+30,19,fg,700,'left',MONO)}

  g.fillStyle='rgba(23,32,42,.022)';for(let y=0;y<H;y+=8)g.fillRect(0,y,W,1);
}

  rr(x+26,y+h-60,102,28,14,accent+'1C',null);rr(x+144,y+h-60,82,28,14,'#EEF0F2',null);g.restore();
}

const layers=[

function focusTopLayer(t){

  const s=mix(1,1.23,p),cx=1270,cy=285;g.save();g.translate(cx,cy);g.scale(s,s);g.translate(-cx,-cy);
  const L=layers[0],x=820,w=900,h=152;g.shadowColor='rgba(36,107,253,.18)';g.shadowBlur=34;rr(x,L.y,w,h,20,C.white,C.blue,3);g.shadowColor='transparent';rr(x,L.y,14,h,7,L.c,null);

  ln(x+370,L.y+76,x+w-68,L.y+76,L.c,8);circle(x+w-68,L.y+76,15,C.white,L.c,7);tag('score + postId',x+w-240,L.y+102,C.white,L.c);g.restore();

function pIn(t,at,d=.65){return ease((t-at)/d)}
function shotTitle(no,title,sub,fact,color=C.blue){
  txt(`${String(no).padStart(2,'0')} / ${fact}`,116,82,20,color,800,'left',MONO);
  txt(title,116,172,58,C.ink,800);
  if(sub)txt(sub,118,222,25,C.muted,500);
  ln(116,254,1804,254,C.line,2);
}
function arrow(x1,y1,x2,y2,color,p=1,w=7){
  p=clamp(p);const xe=mix(x1,x2,p),ye=mix(y1,y2,p);ln(x1,y1,xe,ye,color,w);
  if(p>.94){const a=Math.atan2(y2-y1,x2-x1),s=18;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-Math.cos(a-.5)*s,y2-Math.sin(a-.5)*s);g.lineTo(x2-Math.cos(a+.5)*s,y2-Math.sin(a+.5)*s);g.closePath();g.fillStyle=color;g.fill()}
}
function pill(s,x,y,color=C.blue,fg=C.white,size=20){g.font=`700 ${size}px ${MONO}`;const w=g.measureText(s).width+38;rr(x,y,w,46,23,color,null);txt(s,x+19,y+31,size,fg,700,'left',MONO);return w}
function panel(x,y,w,h,accent=C.blue,fill=C.white){g.save();g.shadowColor='rgba(20,28,36,.09)';g.shadowBlur=20;g.shadowOffsetY=8;rr(x,y,w,h,22,fill,C.line,2);g.restore();rr(x,y,12,h,6,accent,null)}
function polyline(points,color,p=1,w=7){
  const lens=[];let total=0;for(let i=1;i<points.length;i++){const dx=points[i][0]-points[i-1][0],dy=points[i][1]-points[i-1][1];const L=Math.hypot(dx,dy);lens.push(L);total+=L}
  let remain=total*clamp(p);g.beginPath();g.moveTo(points[0][0],points[0][1]);let end=points[0];
  for(let i=1;i<points.length&&remain>0;i++){const q=Math.min(1,remain/lens[i-1]);end=[mix(points[i-1][0],points[i][0],q),mix(points[i-1][1],points[i][1],q)];g.lineTo(end[0],end[1]);remain-=lens[i-1]}
  g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke();return end;
}

  });

  const tr=pIn(t,5.35,.5);if(tr>0){[C.orange,C.blue,C.green,C.orange].forEach((cc,i)=>arrow(960,880,260+i*460,1030,cc,tr,8))}
}
